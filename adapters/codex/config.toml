# Copy this server block to ~/.codex/config.toml or a trusted .codex/config.toml.
[mcp_servers.super_mem]
command = "supermem"
args = ["mcp", "--root", ".", "--namespace", "default"]
startup_timeout_sec = 5
tool_timeout_sec = 10
enabled_tools = [
  "memory_context",
  "memory_record",
  "memory_feedback",
  "memory_manage",
]
