[workspace]
resolver = "2"
members = [
    "crates/super-mem-core",
    "crates/super-mem-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Limme-swe/super-mem"
homepage = "https://github.com/Limme-swe/super-mem"
readme = "README.md"
keywords = ["agents", "memory", "mcp", "ai", "rust"]
categories = ["command-line-utilities", "database"]

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
regex = "1.12"
rmcp = { version = "3.1", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "=0.39.0", default-features = false, features = ["backup", "bundled", "cache", "chrono", "serde_json", "uuid"] }
schemars = { version = "1.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt"] }
uuid = { version = "1.24", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
