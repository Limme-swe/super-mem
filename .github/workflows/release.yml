name: Release binaries

on:
  push:
    branches: [main]
    paths: [.github/release.toml]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SOURCE_DATE_EPOCH: 315532800

jobs:
  metadata:
    name: Validate release metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      notes: ${{ steps.metadata.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - id: metadata
        run: python scripts/release_metadata.py --github-output "$GITHUB_OUTPUT"

  licenses:
    name: Collect third-party licenses
    needs: metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
      - name: Generate dependency license report
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo about generate --fail --locked --workspace about.hbs > THIRD-PARTY-LICENSES.txt
          grep -q '^- anyhow ' THIRD-PARTY-LICENSES.txt
          grep -q '^- rusqlite ' THIRD-PARTY-LICENSES.txt
          python scripts/append_native_notices.py \
            --report THIRD-PARTY-LICENSES.txt \
            --rust-sysroot "$(rustc --print sysroot)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 7

  build:
    name: Package ${{ matrix.name }}
    needs: [metadata, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/supermem
            rustflags: ""
            macos_target: ""
          - name: Windows x86-64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/supermem.exe
            rustflags: -C target-feature=+crt-static
            macos_target: ""
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/supermem
            rustflags: ""
            macos_target: "11.0"
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/supermem
            rustflags: ""
            macos_target: "11.0"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup target add ${{ matrix.target }} --toolchain 1.97.1
          rustup default 1.97.1
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: third-party-licenses
          path: release-licenses
      - name: Add static musl license notice
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: >-
          python scripts/append_native_notices.py
          --report release-licenses/THIRD-PARTY-LICENSES.txt
          --musl-notice /usr/share/doc/musl/copyright
      - name: Run tests for release target
        run: cargo test --workspace --all-targets --all-features --locked --target ${{ matrix.target }}
      - name: Confirm tests did not modify tracked files
        run: git diff --exit-code
      - name: Build release binary
        run: cargo build -p super-mem --bin supermem --release --locked --target ${{ matrix.target }}
      - name: Verify static Linux binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          file "${{ matrix.binary }}"
          if readelf -l "${{ matrix.binary }}" | grep -q INTERP; then
            echo "Linux release unexpectedly contains a dynamic interpreter" >&2
            exit 1
          fi
      - name: Verify static Windows runtime
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("${{ matrix.binary }}")
          $ascii = [Text.Encoding]::ASCII.GetString($bytes).ToUpperInvariant()
          if ($ascii.Contains('VCRUNTIME140.DLL') -or $ascii.Contains('MSVCP140.DLL')) {
            throw 'Windows release unexpectedly imports the dynamic MSVC runtime'
          }
      - name: Verify macOS architecture and deployment target
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          lipo -archs "${{ matrix.binary }}" | grep -F "${{ startsWith(matrix.target, 'aarch64') && 'arm64' || 'x86_64' }}"
          minos=$(otool -l "${{ matrix.binary }}" | awk '
            $1 == "cmd" && $2 == "LC_BUILD_VERSION" { build = 1 }
            build && $1 == "minos" { print $2; exit }
          ')
          if [[ "$minos" != "11.0" ]]; then
            echo "Expected a macOS 11.0 deployment target, found ${minos:-none}" >&2
            exit 1
          fi
      - name: Smoke-test built binary
        run: python scripts/release_smoke.py --binary "${{ matrix.binary }}" --version "${{ needs.metadata.outputs.version }}"
      - name: Build deterministic archive
        run: >-
          python scripts/package_release.py
          --binary "${{ matrix.binary }}"
          --target "${{ matrix.target }}"
          --version "${{ needs.metadata.outputs.version }}"
          --third-party-licenses release-licenses/THIRD-PARTY-LICENSES.txt
          --output-dir dist
      - name: Smoke-test extracted archive
        run: >-
          python scripts/release_smoke.py
          --archive "dist/super-mem-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}${{ contains(matrix.target, 'windows') && '.zip' || '.tar.gz' }}"
          --version "${{ needs.metadata.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [metadata, build]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.metadata.outputs.tag }}
      VERSION: ${{ needs.metadata.outputs.version }}
      NOTES: ${{ needs.metadata.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete release and generate checksums
        run: python scripts/verify_release_assets.py --directory dist --version "$VERSION"
      - name: Require successful CI for this commit
        shell: bash
        run: |
          for attempt in {1..60}; do
            run=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=10" \
              --jq '.workflow_runs | sort_by(.created_at) | last // {}')
            status=$(jq -r '.status // "missing"' <<<"$run")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run")
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "CI concluded $conclusion for $GITHUB_SHA" >&2
                exit 1
              fi
              exit 0
            fi
            echo "Waiting for CI on $GITHUB_SHA (status: $status)"
            sleep 10
          done
          echo "Timed out waiting for CI on $GITHUB_SHA" >&2
          exit 1
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*
      - name: Create or resume draft release
        shell: bash
        run: |
          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            for _ in 1 2 3 4; do
              if [[ "$object_type" == "commit" ]]; then
                printf '%s\n' "$object_sha"
                return 0
              fi
              if [[ "$object_type" != "tag" ]]; then
                return 1
              fi
              read -r object_type object_sha < <(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '[.object.type, .object.sha] | @tsv'
              )
            done
            return 1
          }

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            existing_commit=$(resolve_tag_commit) || {
              echo "Could not resolve existing tag $TAG to a commit" >&2
              exit 1
            }
            if [[ "$existing_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG points at $existing_commit instead of $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          release_was_draft=true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [[ "$draft" != "true" ]]; then
              release_was_draft=false
            else
              while IFS= read -r asset; do
                [[ -z "$asset" ]] || gh release delete-asset "$TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
              done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
              gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "super-mem $TAG" \
              --notes-file "$NOTES" \
              --draft
          fi

          ref_sha=$(resolve_tag_commit) || {
            echo "Could not resolve release tag $TAG to a commit" >&2
            exit 1
          }
          if [[ "$ref_sha" != "$GITHUB_SHA" ]]; then
            echo "Tag $TAG points at $ref_sha instead of $GITHUB_SHA" >&2
            exit 1
          fi

          find dist -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort > actual-assets.txt
          if ! diff -u expected-assets.txt actual-assets.txt; then
            echo "Release $TAG does not contain the exact verified asset set" >&2
            exit 1
          fi

          published=$(mktemp -d)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$published"
          for expected in dist/*; do
            cmp "$expected" "$published/$(basename "$expected")"
          done

          if [[ "$release_was_draft" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            echo "Release $TAG was already published and matches this commit byte-for-byte."
          fi
