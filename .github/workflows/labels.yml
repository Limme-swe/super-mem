name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Create or update labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const labels = JSON.parse(fs.readFileSync(".github/labels.json", "utf8"));
            const seen = new Set();

            for (const label of labels) {
              const { name, color, description } = label;
              if (!name || !/^[0-9a-f]{6}$/i.test(color) || typeof description !== "string") {
                throw new Error(`Invalid label definition: ${JSON.stringify(label)}`);
              }
              if (seen.has(name)) {
                throw new Error(`Duplicate label definition: ${name}`);
              }
              seen.add(name);

              try {
                const current = await github.rest.issues.getLabel({
                  ...context.repo,
                  name,
                });
                const changed =
                  current.data.color.toLowerCase() !== color.toLowerCase() ||
                  (current.data.description ?? "") !== description;
                if (changed) {
                  await github.rest.issues.updateLabel({
                    ...context.repo,
                    name,
                    new_name: name,
                    color,
                    description,
                  });
                  core.info(`Updated ${name}`);
                } else {
                  core.info(`Unchanged ${name}`);
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name,
                  color,
                  description,
                });
                core.info(`Created ${name}`);
              }
            }
