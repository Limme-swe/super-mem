name: Apply long-horizon benchmark

on:
  push:
    branches: ["agent/long-horizon-benchmark"]
    paths: [".github/workflows/apply-long-horizon.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/long-horizon-benchmark
      - name: Materialize reviewed source changes
        shell: bash
        env:
          ARCHIVE_SHA256: 5737b619c1e710b27821f2a605da44f0d0c72724a7c7232d9b7e1df2cd177acc
        run: |
          cat .phase2/long-horizon/part-* | base64 --decode > "$RUNNER_TEMP/changes.tar.gz"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/changes.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/changes.tar.gz" -C .
          python scripts/generate_long_horizon_fixture.py
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/super-mem-core/tests/long_horizon_fixture.rs')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git restore --source=HEAD -- .github/workflows/ci.yml .github/workflows/apply-long-horizon.yml
          rm -rf .phase2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Add long-horizon retrieval benchmark"
          git push origin HEAD:agent/long-horizon-benchmark
